<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日補給 - 晨間能量與冥想小工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: transparent;
      margin: 0;
      padding: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    .widget-banner {
      background-color: #FAF9F6;
      border: 1px solid #E5E0D8;
      box-shadow: 0 6px 20px -4px rgba(74, 70, 62, 0.08);
    }

    .quote-fade {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .quote-fade-out {
      opacity: 0;
      transform: translateY(2px);
    }

    @keyframes wavePulse {
      0%, 100% { height: 7px; }
      50% { height: 22px; }
    }
    .sound-bar {
      width: 4px;
      height: 7px;
      background-color: #6B8E78;
      border-radius: 9999px;
      transition: height 0.2s ease;
    }
    .playing .sound-bar:nth-child(1) { animation: wavePulse 1.1s infinite ease-in-out 0.0s; }
    .playing .sound-bar:nth-child(2) { animation: wavePulse 0.9s infinite ease-in-out 0.2s; }
    .playing .sound-bar:nth-child(3) { animation: wavePulse 1.3s infinite ease-in-out 0.4s; }
    .playing .sound-bar:nth-child(4) { animation: wavePulse 1.0s infinite ease-in-out 0.1s; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: #E5E0D8;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6B8E78;
      margin-top: -5.5px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="widget-banner w-full rounded-2xl px-5 py-6 md:px-8 md:py-7 text-[#4A463E]">
    
    <!-- 頂部標題列：今日補給 + 日期星期 -->
    <div class="flex items-center justify-between pb-4 mb-4 border-b border-[#E5E0D8]">
      <div class="flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-[#6B8E78]"></span>
        <h1 class="text-lg md:text-xl font-bold tracking-wide text-[#3E3A33]">今日補給</h1>
      </div>
      <div id="date-display" class="text-sm font-medium text-[#7D776C]">
        載入日期中...
      </div>
    </div>

    <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-5 md:gap-7">
      
      <!-- 左側：分類與金句 -->
      <div class="flex-1 min-w-0 flex flex-col justify-between gap-4">
        <div class="flex flex-wrap items-center justify-between gap-2.5">
          <div class="flex flex-wrap items-center gap-2" role="tablist">
            <button id="tab-inspire" onclick="selectCategory('inspire')" class="cat-btn px-4 py-2 rounded-full text-sm md:text-[15px] font-semibold transition-all bg-[#6B8E78] text-white shadow-sm">
              ✨ 勵志充能
            </button>
            <button id="tab-funny" onclick="selectCategory('funny')" class="cat-btn px-4 py-2 rounded-full text-sm md:text-[15px] font-semibold transition-all bg-[#F0EDE6] text-[#7D776C]">
              🍵 輕鬆搞笑
            </button>
            <button id="tab-calm" onclick="selectCategory('calm')" class="cat-btn px-4 py-2 rounded-full text-sm md:text-[15px] font-semibold transition-all bg-[#F0EDE6] text-[#7D776C]">
              🌿 心靈安撫
            </button>
          </div>

          <button onclick="nextQuote()" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-sm md:text-[15px] font-semibold text-[#6B8E78] bg-[#6B8E78]/10 active:scale-95 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/>
            </svg>
            <span>換一句</span>
          </button>
        </div>

        <div class="bg-[#F4F1EA] border border-[#EAE5DC] rounded-2xl px-5 py-5 min-h-[96px] flex items-center">
          <p id="quote-text" class="quote-fade text-[20px] md:text-[22px] font-medium leading-relaxed text-[#3E3A33] tracking-wide">
            今天的你，不需要一下子走完所有路，只要先踏出第一步就夠棒了。
          </p>
        </div>
      </div>

      <!-- 分隔線 -->
      <div class="hidden md:block w-[1px] self-stretch bg-[#E5E0D8]"></div>
      <div class="block md:hidden h-[1px] w-full bg-[#E5E0D8]"></div>

      <!-- 右側：柔和音樂播放器 -->
      <div class="w-full md:w-[320px] shrink-0 flex flex-col justify-between gap-3.5">
        <div class="flex items-center justify-between gap-1.5 bg-[#F0EDE6] p-1.5 rounded-xl">
          <button id="sound-bowl" onclick="selectSound('bowl')" class="sound-btn flex-1 py-2 px-2 rounded-lg text-sm font-semibold transition-all bg-white text-[#4A463E] shadow-sm">🔔 晨光頌缽</button>
          <button id="sound-breeze" onclick="selectSound('breeze')" class="sound-btn flex-1 py-2 px-2 rounded-lg text-sm font-semibold transition-all text-[#7D776C]">🍃 靜謐微風</button>
          <button id="sound-forest" onclick="selectSound('forest')" class="sound-btn flex-1 py-2 px-2 rounded-lg text-sm font-semibold transition-all text-[#7D776C]">🌲 森林白噪</button>
        </div>

        <div class="flex items-center justify-between gap-3 bg-[#F4F1EA] border border-[#EAE5DC] rounded-2xl px-4 py-3.5">
          <div class="flex items-center gap-3">
            <button id="play-btn" onclick="togglePlay()" class="w-12 h-12 rounded-full bg-[#6B8E78] active:scale-95 text-white flex items-center justify-center shadow-sm shrink-0">
              <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 ml-0.5" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                <rect x="14" y="4" width="4" height="16" rx="1"></rect>
              </svg>
            </button>
            <div class="flex flex-col">
              <span id="audio-status" class="text-sm font-medium text-[#7D776C]">點擊播放療癒音</span>
              <div id="wave-container" class="flex items-end gap-1.5 h-5 mt-1">
                <span class="sound-bar"></span><span class="sound-bar"></span><span class="sound-bar"></span><span class="sound-bar"></span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 w-24">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#8C857B] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0
