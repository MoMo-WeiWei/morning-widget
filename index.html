<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日補給與 Notion 互動體驗沙盒</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: transparent;
      margin: 0;
      padding: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    .widget-banner {
      background-color: #FAF9F6;
      border: 1px solid #E5E0D8;
      box-shadow: 0 6px 20px -4px rgba(74, 70, 62, 0.08);
    }

    .fade-content {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .fade-out {
      opacity: 0;
      transform: translateY(3px);
    }

    @keyframes wavePulse {
      0%, 100% { height: 7px; }
      50% { height: 22px; }
    }
    .sound-bar {
      width: 4px;
      height: 7px;
      background-color: #6B8E78;
      border-radius: 9999px;
      transition: height 0.2s ease;
    }
    .playing .sound-bar:nth-child(1) { animation: wavePulse 1.1s infinite ease-in-out 0.0s; }
    .playing .sound-bar:nth-child(2) { animation: wavePulse 0.9s infinite ease-in-out 0.2s; }
    .playing .sound-bar:nth-child(3) { animation: wavePulse 1.3s infinite ease-in-out 0.4s; }
    .playing .sound-bar:nth-child(4) { animation: wavePulse 1.0s infinite ease-in-out 0.1s; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: #E5E0D8;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6B8E78;
      margin-top: -5.5px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    @keyframes pulseBorder {
      0%, 100% { box-shadow: 0 0 0 0 rgba(107, 142, 120, 0.4); }
      50% { box-shadow: 0 0 0 5px rgba(107, 142, 120, 0); }
    }
    .guide-highlight {
      animation: pulseBorder 2s infinite;
    }
  </style>
</head>
<body>

  <div class="widget-banner w-full rounded-2xl px-5 py-6 md:px-8 md:py-7 text-[#4A463E]">
    
    <!-- 頂部導覽列：今日補給 / 怎麼用 切換 + 日期星期 -->
    <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-5 border-b border-[#E5E0D8]">
      <div class="flex items-center gap-2 bg-[#F0EDE6] p-1.5 rounded-xl" role="tablist">
        <button
          id="main-tab-daily"
          onclick="switchMainPage('daily')"
          class="px-4 py-2 rounded-lg text-sm md:text-[15px] font-bold transition-all bg-[#6B8E78] text-white shadow-sm flex items-center gap-1.5"
        >
          <span>✦ 今日補給</span>
        </button>
        <button
          id="main-tab-guide"
          onclick="switchMainPage('guide')"
          class="px-4 py-2 rounded-lg text-sm md:text-[15px] font-bold transition-all text-[#7D776C] hover:text-[#4A463E] flex items-center gap-1.5"
        >
          <span>❓ 怎麼用（互動練習）</span>
        </button>
      </div>

      <div id="date-display" class="text-sm font-medium text-[#7D776C]">
        載入日期中...
      </div>
    </div>

    <!-- ========================================== -->
    <!-- 頁面一：今日補給                           -->
    <!-- ========================================== -->
    <div id="page-daily" class="fade-content flex flex-col md:flex-row items-stretch md:items-center justify-between gap-5 md:gap-7">
      
      <!-- 左側：分類與金句 -->
      <div class="flex-1 min-w-0 flex flex-col justify-between gap-4">
        <div class="flex flex-wrap items-center justify-between gap-2.5">
          <div class="flex flex-wrap items-center gap-2" role="tablist">
            <button id="tab-inspire" onclick="selectCategory('inspire')" class="cat-btn px-4 py-2 rounded-full text-sm md:text-[15px] font-semibold transition-all bg-[#6B8E78] text-white shadow-sm">
              ✨ 勵志充能
            </button>
            <button id="tab-funny" onclick="selectCategory('funny')" class="cat-btn px-4 py-2 rounded-full text-sm md:text-[15px] font-semibold transition-all bg-[#F0EDE6] text-[#7D776C]">
              🍵 輕鬆搞笑
            </button>
            <button id="tab-calm" onclick="selectCategory('calm')" class="cat-btn px-4 py-2 rounded-full text-sm md:text-[15px] font-semibold transition-all bg-[#F0EDE6] text-[#7D776C]">
              🌿 心靈安撫
            </button>
          </div>

          <button onclick="nextQuote()" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-sm md:text-[15px] font-semibold text-[#6B8E78] bg-[#6B8E78]/10 active:scale-95 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/>
            </svg>
            <span>換一句</span>
          </button>
        </div>

        <!-- 質感金句框 -->
        <div class="bg-[#F4F1EA] border border-[#EAE5DC] rounded-2xl px-5 py-5 min-h-[105px] flex items-center">
          <div id="quote-container" class="fade-content flex items-start gap-2.5 w-full">
            <span class="text-3xl md:text-4xl text-[#B5AEA0] font-serif leading-none select-none shrink-0 -mt-1">“</span>
            <div class="flex-1 flex flex-col md:flex-row md:items-baseline justify-between gap-2">
              <p id="quote-text" class="text-[18px] md:text-[20px] font-medium leading-relaxed text-[#3E3A33] tracking-wide">
                今天的努力不是為了取悅誰，而是為了讓未來的自己多一點選擇的自由。
              </p>
              <span id="quote-note" class="text-xs md:text-sm font-medium text-[#8C857B] md:text-right shrink-0">
                — 給未來的禮物自由
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- 分隔線 -->
      <div class="hidden md:block w-[1px] self-stretch bg-[#E5E0D8]"></div>
      <div class="block md:hidden h-[1px] w-full bg-[#E5E0D8]"></div>

      <!-- 右側：柔和音樂播放器 -->
      <div class="w-full md:w-[320px] shrink-0 flex flex-col justify-between gap-3.5">
        <div class="flex items-center justify-between gap-1.5 bg-[#F0EDE6] p-1.5 rounded-xl">
          <button id="sound-bowl" onclick="selectSound('bowl')" class="sound-btn flex-1 py-2 px-2 rounded-lg text-sm font-semibold transition-all bg-white text-[#4A463E] shadow-sm">🔔 晨光頌缽</button>
          <button id="sound-breeze" onclick="selectSound('breeze')" class="sound-btn flex-1 py-2 px-2 rounded-lg text-sm font-semibold transition-all text-[#7D776C]">🍃 靜謐微風</button>
          <button id="sound-forest" onclick="selectSound('forest')" class="sound-btn flex-1 py-2 px-2 rounded-lg text-sm font-semibold transition-all text-[#7D776C]">🌲 森林白噪</button>
        </div>

        <div class="flex items-center justify-between gap-3 bg-[#F4F1EA] border border-[#EAE5DC] rounded-2xl px-4 py-3.5">
          <div class="flex items-center gap-3">
            <button id="play-btn" onclick="togglePlay()" class="w-12 h-12 rounded-full bg-[#6B8E78] active:scale-95 text-white flex items-center justify-center shadow-sm shrink-0">
              <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 ml-0.5" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                <rect x="14" y="4" width="4" height="16" rx="1"></rect>
              </svg>
            </button>
            <div class="flex flex-col">
              <span id="audio-status" class="text-sm font-medium text-[#7D776C]">點擊播放療癒音</span>
              <div id="wave-container" class="flex items-end gap-1.5 h-5 mt-1">
                <span class="sound-bar"></span><span class="sound-bar"></span><span class="sound-bar"></span><span class="sound-bar"></span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 w-24">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#8C857B] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.4" oninput="updateVolume(this.value)" class="w-full" />
          </div>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- 頁面二：「怎麼用」可點擊互動模擬沙盒       -->
    <!-- ========================================== -->
    <div id="page-guide" class="hidden fade-content flex-col gap-4">
      
      <!-- 頂部步驟切換膠囊 -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div id="step-pills" class="flex flex-wrap items-center gap-1.5"></div>
        <span id="step-counter" class="text-sm font-semibold text-[#6B8E78] bg-[#6B8E78]/10 px-3 py-1 rounded-full">
          關卡 1 / 5
        </span>
      </div>

      <!-- 上下排版互動區：上方引導 + 下方模擬操作試玩區 -->
      <div id="guide-card" class="fade-content flex flex-col gap-4">
        
        <!-- 上方：引導說明 + 上下一步 -->
        <div class="bg-[#F4F1EA] border border-[#EAE5DC] rounded-2xl p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
          <div class="flex flex-col gap-2 flex-1">
            <span id="guide-badge" class="self-start px-3 py-1 rounded-lg bg-[#6B8E78] text-white text-xs font-bold tracking-wide">
              STEP 01 · 晨間動線
            </span>
            <h2 id="guide-title" class="text-lg md:text-xl font-bold text-[#3E3A33]">
              標題載入中
            </h2>
            <p id="guide-desc" class="text-[16px] md:text-[17px] font-medium leading-relaxed text-[#4A463E]">
              說明載入中
            </p>
            <div id="guide-hint-box" class="mt-1 bg-white/90 border border-[#E5E0D8] rounded-xl px-3.5 py-2 text-sm text-[#5A5449] leading-relaxed">
              💡 請依序點擊下方的按鈕體驗！
            </div>
          </div>

          <div class="flex items-center gap-2.5 shrink-0 w-full md:w-auto justify-end pt-3 md:pt-0 border-t md:border-t-0 border-[#E5E0D8]">
            <button
              id="btn-prev-step"
              onclick="changeStep(-1)"
              class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-white border border-[#E5E0D8] text-[#7D776C] hover:text-[#3E3A33] disabled:opacity-40 disabled:pointer-events-none transition-all"
            >
              ← 上一步
            </button>
            <button
              id="btn-next-step"
              onclick="changeStep(1)"
              class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-[#6B8E78] hover:bg-[#5A7B66] active:scale-95 text-white shadow-sm transition-all"
            >
              下一步 →
            </button>
          </div>
        </div>

        <!-- 下方：擬真 Notion 互動體驗區塊 -->
        <div class="bg-white border-2 border-[#D8D2C5] rounded-2xl p-4 md:p-5 flex flex-col justify-between shadow-inner">
          <div class="flex items-center justify-between pb-2.5 mb-3 border-b border-[#EFECE6]">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#E07A5F]"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-[#F2CC8F]"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-[#6B8E78]"></span>
              <span id="sim-header-title" class="ml-1 text-xs md:text-sm font-bold text-[#7D776C]">Notion 互動模擬區（可直接點擊體驗）</span>
            </div>
            <span class="text-xs font-semibold text-[#6B8E78] bg-[#6B8E78]/10 px-2.5 py-0.5 rounded-md">請點擊上方的按鈕</span>
          </div>

          <!-- 動態渲染各步驟的互動按鈕與模擬畫面 -->
          <div id="sim-interactive-area" class="py-2"></div>

          <!-- 底部即時操作反饋條 -->
          <div id="sim-feedback" class="mt-3 bg-[#F4F1EA] rounded-xl px-3.5 py-2 text-xs md:text-sm font-medium text-[#4E6E5A] flex items-center gap-2">
            <span>✦</span>
            <span id="sim-feedback-text">請依序點擊上方的按鈕，體驗 Notion 系統實際運作方式！</span>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    // ==========================================
    // 1. 日期顯示與主頁面切換
    // ==========================================
    function updateDate() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('date-display').textContent = now.toLocaleDateString('zh-TW', options);
    }
    updateDate();

    function switchMainPage(page) {
      const dailyPage = document.getElementById('page-daily');
      const guidePage = document.getElementById('page-guide');
      const dailyTab = document.getElementById('main-tab-daily');
      const guideTab = document.getElementById('main-tab-guide');

      if (page === 'daily') {
        guidePage.classList.add('hidden');
        guidePage.classList.remove('flex');
        dailyPage.classList.remove('hidden');
        
        dailyTab.classList.add('bg-[#6B8E78]', 'text-white', 'shadow-sm');
        dailyTab.classList.remove('text-[#7D776C]');
        guideTab.classList.remove('bg-[#6B8E78]', 'text-white', 'shadow-sm');
        guideTab.classList.add('text-[#7D776C]');
      } else {
        dailyPage.classList.add('hidden');
        guidePage.classList.remove('hidden');
        guidePage.classList.add('flex');

        guideTab.classList.add('bg-[#6B8E78]', 'text-white', 'shadow-sm');
        guideTab.classList.remove('text-[#7D776C]');
        dailyTab.classList.remove('bg-[#6B8E78]', 'text-white', 'shadow-sm');
        dailyTab.classList.add('text-[#7D776C]');
        renderGuideStep();
      }
    }

    // ==========================================
    // 2. 「怎麼用」5 階段互動沙盒狀態與重置邏輯
    // ==========================================
    let currentStepIndex = 0;

    let simState = {
      step1Active: 0,
      step2Choice: null,
      step3Checks: [false, false],
      step3Toggles: { shop: false, party: false },
      step3ExtraCount: 0,
      step4Archived: false,
      step4NewWeekCreated: false,
      step5TempTasks: ['研究下季行銷提案靈感'],
      step5CalendarTasks: ['週五前提交設計初稿']
    };

    function fnResetStepState(stepIdx) {
      if (stepIdx === 0) simState.step1Active = 0;
      else if (stepIdx === 1) simState.step2Choice = null;
      else if (stepIdx === 2) {
        simState.step3Checks = [false, false];
        simState.step3Toggles = { shop: false, party: false };
        simState.step3ExtraCount = 0;
      } else if (stepIdx === 3) {
        simState.step4Archived = false;
        simState.step4NewWeekCreated = false;
      } else if (stepIdx === 4) {
        simState.step5TempTasks = ['研究下季行銷提案靈感'];
        simState.step5CalendarTasks = ['週五前提交設計初稿'];
      }
    }

    const guideSteps = [
      {
        pill: "1. 晨間動線",
        badge: "STEP 01 · 每日開場",
        title: "先給自己能量補給，再依序看任務",
        desc: "每天早晨先在「今日補給」點金句、聽音樂放鬆神經；心情就緒後，依序由上往下瀏覽頁面。",
        hint: "👉 請依序點擊下方的 1、2、3 按鈕，感受每天早上的瀏覽順序。"
      },
      {
        pill: "2. 任務分流",
        badge: "STEP 02 · 前晚分類",
        title: "前一天晚上先判斷：簡易 vs 複雜",
        desc: "睡前花 2 分鐘將腦中的待辦分流：例行瑣事放「簡易週任務」，需要進度的放「資料庫追蹤區」。",
        hint: "👉 點擊下方的任務按鈕，幫它們選擇該放進哪一個區塊！"
      },
      {
        pill: "3. 簡易週任務",
        badge: "STEP 03 · 週任務區塊實戰",
        title: "免建資料庫！勾選、拖拉與折疊長清單",
        desc: "以「⏰ 鬧鐘圖樣」突出當日任務。按 [ ] + 空格建核取方塊，按 > + 空格用折疊列表收合購物清單或聚餐細節。",
        hint: "👉 直接點擊下方的核取方塊打勾、點「▶」展開折疊清單，或按按鈕體驗新增！"
      },
      {
        pill: "4. 封存與開新週",
        badge: "STEP 04 · 每週重置流程",
        title: "整週結束後：放入封存區 + 開啟新一週",
        desc: "整週任務勾選結束後，將當週區塊轉成頁面放入「封存任務」（方便日後反推幾月幾號做過），再按「新一週任務」。",
        hint: "👉 依序點擊下方的「📦 移入封存任務」與「🆕 新一週任務」按鈕體驗換週！"
      },
      {
        pill: "5. 資料庫追蹤",
        badge: "STEP 05 · 快速按鈕與日曆",
        title: "臨時靈感先暫存，有空直接拉進日曆",
        desc: "沒截止日的靈感按「任務暫存」，有確切日期按「有新任務！」。空閒時再把暫存任務拉進日曆日期。",
        hint: "👉 點擊下方「💡 任務暫存」或「🎯 有新任務！」，再點卡片把任務排進日曆！"
      }
    ];

    function setSimFeedback(msg) {
      const el = document.getElementById('sim-feedback-text');
      if (el) el.innerHTML = msg;
    }

    function renderSimArea() {
      const area = document.getElementById('sim-interactive-area');
      const headerTitle = document.getElementById('sim-header-title');

      if (currentStepIndex === 0) {
        headerTitle.textContent = "模擬畫面：每日早晨瀏覽順序";
        const items = [
          { num: "1", icon: "✨", title: "今日補給區", sub: "點選金句風格 + 播放柔和音樂舒緩神經" },
          { num: "2", icon: "⏰", title: "簡易週任務區塊", sub: "一眼看清今天（鬧鐘標示）有哪些例行代辦" },
          { num: "3", icon: "📅", title: "資料庫追蹤任務區", sub: "往下查看本週需要持續推進與追蹤的任務" }
        ];
        area.innerHTML = `
          <div class="flex flex-col gap-2.5">
            ${items.map((it, idx) => {
              const active = simState.step1Active === idx;
              return `
                <button onclick="simClickStep1(${idx})" class="w-full text-left p-3 rounded-xl border transition-all flex items-center justify-between gap-3 ${active ? 'bg-[#6B8E78]/15 border-[#6B8E78] guide-highlight' : 'bg-[#FAF9F6] border-[#E5E0D8] hover:bg-[#F4F1EA]'}">
                  <div class="flex items-center gap-3">
                    <span class="w-7 h-7 rounded-full ${active ? 'bg-[#6B8E78] text-white' : 'bg-[#E5E0D8] text-[#575248]'} text-xs font-bold flex items-center justify-center shrink-0">${it.num}</span>
                    <div>
                      <div class="text-sm md:text-[15px] font-bold text-[#3E3A33]">${it.icon} ${it.title}</div>
                      <div class="text-xs text-[#7D776C]">${it.sub}</div>
                    </div>
                  </div>
                  <span class="text-xs font-bold px-2.5 py-1 rounded-lg ${active ? 'bg-[#6B8E78] text-white' : 'bg-white text-[#7D776C] border border-[#E5E0D8]'}">
                    ${active ? '目前步驟' : '點我檢視'}
                  </span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      } else if (currentStepIndex === 1) {
        headerTitle.textContent = "模擬練習：前晚思考任務要放哪裡？";
        area.innerHTML = `
          <div class="flex flex-col gap-3">

        } while (newIndex === lastQuoteIndex && list.length > 1);
      }
      lastQuoteIndex = newIndex;

      containerEl.classList.add('fade-out');
      setTimeout(() => {
        textEl.textContent = list[newIndex].text;
        noteEl.textContent = list[newIndex].note;
        containerEl.classList.remove('fade-out');
      }, 150);
    }

    // ==========================================
    // 4. 柔和冥想純音引擎
    // ==========================================
    let audioCtx = null;
    let isPlaying = false;
    let currentSound = 'bowl';
    let masterGain = null;
    let activeNodes = [];
    let bowlInterval = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = document.getElementById('volume-slider').value;
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function stopAllSounds() {
      if (bowlInterval) { clearInterval(bowlInterval); bowlInterval = null; }
      activeNodes.forEach(node => {
        try { if (node.stop) node.stop(); if (node.disconnect) node.disconnect(); } catch (e) {}
      });
      activeNodes = [];
    }

    function triggerBowlStrike() {
      if (!audioCtx || !isPlaying) return;
      const now = audioCtx.currentTime;
      const freqs = [196.00, 293.66, 392.00];
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);

        const peak = idx === 0 ? 0.18 : (idx === 1 ? 0.08 : 0.03);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(peak, now + 0.4);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 7.0);

        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 7.2);
        activeNodes.push(osc, gain);
      });
    }

    function startSoundscape(type) {
      initAudio();
      stopAllSounds();
      if (type === 'bowl') {
        triggerBowlStrike();
        bowlInterval = setInterval(triggerBowlStrike, 7500);
      } else {
        const bufferSize = 2 * audioCtx.sampleRate;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= 2.0;
        }
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = type === 'breeze' ? 180 : 350;
        const envGain = audioCtx.createGain();
        envGain.gain.value = type === 'breeze' ? 0.4 : 0.25;
        whiteNoise.connect(filter);
        filter.connect(envGain);
        envGain.connect(masterGain);
        whiteNoise.start(0);
        activeNodes.push(whiteNoise, filter, envGain);
      }
    }

    function togglePlay() {
      const playIcon = document.getElementById('icon-play');
      const pauseIcon = document.getElementById('icon-pause');
      const waveContainer = document.getElementById('wave-container');
      const statusText = document.getElementById('audio-status');

      if (!isPlaying) {
        isPlaying = true;
        startSoundscape(currentSound);
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        waveContainer.classList.add('playing');
        statusText.textContent = '療癒音播放中...';
      } else {
        isPlaying = false;
        stopAllSounds();
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        waveContainer.classList.remove('playing');
        statusText.textContent = '已暫停';
      }
    }

    function selectSound(sound) {
      currentSound = sound;
      document.querySelectorAll('.sound-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-[#4A463E]', 'shadow-sm');
        btn.classList.add('text-[#7D776C]');
      });
      const activeBtn = document.getElementById(`sound-${sound}`);
      activeBtn.classList.remove('text-[#7D776C]');
      activeBtn.classList.add('bg-white', 'text-[#4A463E]', 'shadow-sm');
      if (isPlaying) { startSoundscape(currentSound); }
    }

    function updateVolume(val) {
      if (masterGain && audioCtx) {
        masterGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
      }
    }
  </script>
</body>
