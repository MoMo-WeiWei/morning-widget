<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>晨間能量與冥想橫長條小工具（特大清晰版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: transparent;
      margin: 0;
      padding: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    .widget-banner {
      background-color: #FAF9F6;
      border: 1px solid #E5E0D8;
      box-shadow: 0 6px 20px -4px rgba(74, 70, 62, 0.08);
    }

    .quote-fade {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .quote-fade-out {
      opacity: 0;
      transform: translateY(2px);
    }

    @keyframes wavePulse {
      0%, 100% { height: 7px; }
      50% { height: 22px; }
    }
    .sound-bar {
      width: 4px;
      height: 7px;
      background-color: #6B8E78;
      border-radius: 9999px;
      transition: height 0.2s ease;
    }
    .playing .sound-bar:nth-child(1) { animation: wavePulse 1.1s infinite ease-in-out 0.0s; }
    .playing .sound-bar:nth-child(2) { animation: wavePulse 0.9s infinite ease-in-out 0.2s; }
    .playing .sound-bar:nth-child(3) { animation: wavePulse 1.3s infinite ease-in-out 0.4s; }
    .playing .sound-bar:nth-child(4) { animation: wavePulse 1.0s infinite ease-in-out 0.1s; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: #E5E0D8;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #6B8E78;
      margin-top: -5.5px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
  </style>
</head>

            >
              ✨ 勵志充能
            </button>
